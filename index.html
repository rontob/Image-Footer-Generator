<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Footer Image Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="container">
    <h1>Footer Image Generator</h1>
    <p>Menambahkan kontak Anda pada gambar</p>
    

    <input type="file" id="imageInput" accept="image/*">

    <input
        type="text"
        id="urlInput"
        placeholder="Masukkan URL Website">

    <input
        type="text"
        id="waInput"
        placeholder="Masukkan Nomor WhatsApp">

    <button id="generateBtn">
        Generate Gambar
    </button>

    <canvas id="canvas"></canvas>

    <button id="downloadBtn" style="display:none;">
        Download Hasil
    </button>
</div>
    <div class="footer-donate">

        <a href="https://rontob.github.io/kalimat-promosi-generator/sawertrustpartner.jpg"
           target="_blank">

            <img
                src="https://rontob.github.io/kalimat-promosi-generator/sawertrustpartner.jpg"
                alt="Sawer" loading="lazy">

            <span>☕ Sawer Ah</span>

        </a>

    </div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script src="script.js"></script>

</body>
</html>
